<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Post Sender</title>
</head>
<body style="font-family: sans-serif; max-width: 640px; margin: 40px auto; padding: 0 16px; line-height: 1.6;">
  <h1>Post Sender</h1>
  <p>Post Sender is an Android app that lets you write a post once (a photo or
  video, a title and a description) and send it to your own channels and
  accounts on several platforms, including YouTube, Telegram, Eitaa, Bale and
  Rubika.</p>
  <p><a href="privacy.html">Privacy policy</a></p>
  <p>Contact: najva.association@gmail.com</p>
  <script>
  const urlParams = new URLSearchParams(window.location.search);
  const code = urlParams.get('code');
  if (code) {
    const box = document.createElement('div');
    box.style = "padding:20px; background:#e0f2fe; border:1px solid #0284c7; margin:20px; border-radius:8px;";
    box.innerHTML = `<h3>TikTok Authorization Code:</h3><input type="text" value="${code}" style="width:100%; padding:8px; font-size:16px;" readonly onclick="this.select()"/>`;
    document.body.prepend(box);
  }
</script>
</body>
</html>
